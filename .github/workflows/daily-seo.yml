name: Daily SEO Content

on:
  # PAUSED 2026-10-09. The daily post is written to seo-scheduled-posts.json
  # but is not added to INDEXABLE_BLOG_SLUGS, so Google never sees it: 380
  # posts exist and 28 are indexable. Publishing more noindexed pages cannot
  # move rankings. Re-enable once posts are indexable by default.
  #   schedule:
  # - cron: '0 10 * * *'   # 10 AM UTC = 6 AM ET daily
  workflow_dispatch:         # Also allows manual trigger from GitHub Actions tab

# Serialize with the GEO bot and SEO Pipeline so concurrent pushes to main
# don't collide (the cause of the "failed to push some refs" failures).
concurrency:
  group: content-push
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Publication blackout check (Shabbat / Jewish holidays)
        id: blackout
        # Owner rule: no publishing on Shabbat or Jewish holidays and their eves.
        # Fails closed: if this step errors, the guarded steps below are skipped.
        run: |
          mkdir -p "$RUNNER_TEMP/blackout"
          cp scripts/publication-blackout.mjs "$RUNNER_TEMP/blackout/"
          npm install --prefix "$RUNNER_TEMP/blackout" --no-save --no-audit --no-fund @hebcal/core@6.14.6
          node "$RUNNER_TEMP/blackout/publication-blackout.mjs"

      - name: Generate SEO content
        if: steps.blackout.outputs.blackout == 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-seo.mjs

      - name: Publication blackout re-check before push
        id: blackout_recheck
        # Owner rule: no publishing on Shabbat or Jewish holidays and their eves.
        # Fails closed: if this step errors, the guarded steps below are skipped.
        if: steps.blackout.outputs.blackout == 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/blackout"
          cp scripts/publication-blackout.mjs "$RUNNER_TEMP/blackout/"
          npm install --prefix "$RUNNER_TEMP/blackout" --no-save --no-audit --no-fund @hebcal/core@6.14.6
          node "$RUNNER_TEMP/blackout/publication-blackout.mjs"

      - name: Commit and push if content was added
        if: steps.blackout.outputs.blackout == 'false' && steps.blackout_recheck.outputs.blackout == 'false'
        run: |
          git config user.name "AssetLift SEO Bot"
          git config user.email "seo-bot@assetliftlending.com"
          git add lib/data/seo-scheduled-posts.json
          if git diff --staged --quiet; then
            echo "No new content today"
          else
            git commit -m "Daily SEO: add new blog post [$(date +'%Y-%m-%d')]"
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                echo "pushed on attempt $i"; break
              fi
              echo "push attempt $i failed; retrying after backoff..."; sleep $((RANDOM % 8 + 3))
            done
          fi
